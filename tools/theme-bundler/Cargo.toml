[package]
name = "nimrod-theme-bundler"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking"] }
plist = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
