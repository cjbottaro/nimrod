name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.0)'
        required: true
        type: string

# Serialize all versions, including tap updates. Never cancel a notarization midway.
concurrency:
  group: nimrod-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, package versions and changelog notes
        id: metadata
        run: node scripts/release.mjs metadata
      - name: Require public downloads for the stable cask
        if: steps.metadata.outputs.prerelease == 'false' && github.event.repository.private
        run: |
          echo 'Stable Homebrew downloads require this repository and its releases to be public.' >&2
          exit 1
      - name: Pin source commit and require main ancestry
        id: commit
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: release
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Offline checks and fixture tests
        run: mise run check
      - name: Import release certificate and notarization key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/prepare-release-signing.sh
      - name: Build, sign and notarize the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run tauri build -- --ci --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json --bundles app,dmg -- --locked
      - name: Verify app and notarize the final DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/verify-release-macos.sh
      - name: Stage immutable release asset
        run: node scripts/release.mjs stage arm64 src-tauri/target/aarch64-apple-darwin/release/bundle release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-assets/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/nimrod-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/nimrod-signing.p12" "$RUNNER_TEMP/nimrod-notarization.p8"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets
      - name: Publish verified Apple Silicon release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release.mjs publish release-assets
      - name: Retain exact published cask for the tap job
        if: needs.prepare.outputs.prerelease == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: release-assets/nimrod.rb
          if-no-files-found: error
          retention-days: 7

  homebrew:
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: macos-15
    timeout-minutes: 10
    environment: homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Require tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { echo 'Set HOMEBREW_TAP_TOKEN before publishing stable releases.' >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-cask
          path: release-assets
      - name: Check out the dedicated tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'cjbottaro/homebrew-tap' }}
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Validate and update the stable cask
        shell: bash
        run: |
          ruby -c release-assets/nimrod.rb
          if [[ -e homebrew-tap/Casks/nimrod.rb ]]; then
            node scripts/release.mjs check-cask-upgrade homebrew-tap/Casks/nimrod.rb release-assets/nimrod.rb
          fi
          mkdir -p homebrew-tap/Casks
          cp release-assets/nimrod.rb homebrew-tap/Casks/nimrod.rb
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Casks/nimrod.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo 'Tap already matches this release.'
            exit 0
          fi
          git -C homebrew-tap commit -m "Update Nimrod to ${RELEASE_TAG#v}"
          git -C homebrew-tap push origin HEAD:main
